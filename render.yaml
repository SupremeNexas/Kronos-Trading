services:
  - type: web
    name: kronos-trading-ai
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FLASK_ENV
        value: production
      - key: MARKET_DATA_PROVIDER
        value: mock
      - key: TRADING_MODE
        value: paper
      - key: FORECAST_MODE
        value: mock
