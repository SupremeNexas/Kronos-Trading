<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Set title structure to match what content.js expects to parse -->
  <title>BTCUSD 64200.00 ▲ +0.50% - TradingView</title>
  <!-- Load extension styles directly -->
  <link rel="stylesheet" href="/extension/content.css">
  <style>
    body {
      background-color: #0b0e14;
      color: #d1d4dc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .tv-header {
      height: 48px;
      background-color: #1c2030;
      border-bottom: 2px solid #2a2e39;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 20px;
    }
    .tv-logo {
      color: #2962ff;
      font-weight: bold;
      font-size: 18px;
      letter-spacing: 0.5px;
    }
    #header-toolbar-symbol-search {
      background-color: #2a2e39;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      color: white;
    }
    #header-toolbar-intervals {
      background-color: #2a2e39;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      color: white;
    }
    .chart-container {
      flex-grow: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .chart-grid {
      border: 1px dashed rgba(255,255,255,0.07);
      width: 100%;
      max-width: 800px;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: radial-gradient(circle, rgba(28,32,48,0.5) 0%, rgba(11,14,20,0.5) 100%);
      margin-bottom: 20px;
    }
    select {
      background-color: #2a2e39;
      color: white;
      border: 1px solid #363c4e;
      padding: 6px 10px;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="tv-header">
    <span class="tv-logo">TradingView</span>

    <!-- Selector to change mock ticker -->
    <span style="font-size: 12px; color: #787b86">Select Mock Symbol:</span>
    <select id="mock-symbol-select">
      <option value="BTCUSD">BTCUSD (Crypto)</option>
      <option value="AAPL">AAPL (US Equities)</option>
      <option value="600580">600580 (A-Shares)</option>
    </select>

    <div id="header-toolbar-symbol-search">BTCUSD</div>
    <div id="header-toolbar-intervals">1h</div>
  </div>

  <div class="chart-container">
    <div class="chart-grid">
      <span style="color: #4c525e; font-size: 18px; font-weight: 500;">TradingView Interactive Area</span>
    </div>
    <p style="font-size: 13px; color: #787b86; max-width: 500px;">
      This is a local sandbox simulating <code>tradingview.com</code>. The Kronos Bridge extension sidebar in the bottom-right was loaded successfully! Update the ticker above to test forecasts.
    </p>
  </div>

  <!-- Load the extension content.js script -->
  <script src="/extension/content.js"></script>

  <script>
    // Bind symbol-select change to update elements for content.js
    const select = document.getElementById('mock-symbol-select');
    const symbolEl = document.getElementById('header-toolbar-symbol-search');

    select.addEventListener('change', () => {
      symbolEl.textContent = select.value;
      document.title = select.value + " 64200.00 ▲ +0.50% - TradingView";
      // Manually trigger the scrape check
      if (typeof updateTickerInfo === 'function') {
        updateTickerInfo();
      }
    });

    // Reset initial title
    document.title = "BTCUSD 64200.00 ▲ +0.50% - TradingView";
  </script>

</body>
</html>
